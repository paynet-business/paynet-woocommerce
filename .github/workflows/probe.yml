name: API probes

# Requests to the Paynet TEST API with the public shared credentials (docs.paynet.md).
# Finds field limits and request rules the documentation does not state (ТЗ В-10).
on:
  workflow_dispatch:
  push:
    branches: ['stage-*']
    paths: ['tools/probe-api.js', '.github/workflows/probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-api.js probe-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-probes
          path: probe-results.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --no-progress
      - name: Translations (.pot / .po / .mo up to date, RU and RO complete)
        run: php tools/i18n.php check
      - name: PHPUnit
        run: vendor/bin/phpunit --testdox --log-junit junit.xml
      - name: Report
        if: always()
        run: |
          {
            echo "## Unit tests — PHP ${{ matrix.php }}"
            if [ -f junit.xml ]; then
              php -r '$x=simplexml_load_file("junit.xml"); $s=$x->testsuite; printf("Tests: **%d**, failures: **%d**, errors: **%d**\n\n", $s["tests"], $s["failures"], $s["errors"]);'
            else
              echo "No result file."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distributable copy
        run: |
          mkdir -p build/paynet-for-woocommerce
          rsync -a --exclude-from=.distignore ./ build/paynet-for-woocommerce/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/paynet-for-woocommerce

  package:
    name: Archive for manual installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the archive
        run: bash tools/build-dist.sh build
      - name: Report (Summary)
        run: |
          {
            echo "## Archive for manual installation"
            echo ""
            echo "Download: **Artifacts → paynet-for-woocommerce-zip** (GitHub wraps the file in one more .zip: unpack it once, inside is paynet-for-woocommerce-VERSION.zip)."
            echo ""
            echo '```'
            cat build/paynet-for-woocommerce-*.zip.sha256
            echo '```'
            echo ""
            echo "Contents:"
            echo ""
            echo '```'
            unzip -Z1 build/paynet-for-woocommerce-*.zip | grep -v '/$'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paynet-for-woocommerce-zip
          path: |
            build/paynet-for-woocommerce-*.zip
            build/paynet-for-woocommerce-*.zip.sha256
          retention-days: 90

  e2e:
    name: E2E (HPOS ${{ matrix.hpos }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        hpos: ['on', 'off']
    env:
      STAGE: '7'
      TZ_COVERAGE: '33'
      HPOS: ${{ matrix.hpos }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paynet-for-woocommerce-zip
          path: build/zip
      - name: Install the plugin from the archive (E2E runs on exactly what is shipped)
        working-directory: .
        run: |
          unzip -q build/zip/paynet-for-woocommerce-*.zip -d build
          test -f build/paynet-for-woocommerce/paynet-for-woocommerce.php
          jq '.plugins[1] = "./build/paynet-for-woocommerce"' .wp-env.json > .wp-env.ci.json
          mv .wp-env.ci.json .wp-env.json
          cat .wp-env.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress + WooCommerce
        run: e2e/node_modules/.bin/wp-env start
        working-directory: .
        env:
          WP_ENV_HOME: ${{ runner.temp }}/wp-env
      - name: Prepare store (MDL, Moldova)
        working-directory: .
        run: |
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_currency MDL
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_default_country MD
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_coming_soon no
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_onboarding_profile '{"skipped":true}' --format=json
          # HPOS on/off is set by the E2E setup (after WooCommerce finishes installing on the first web request).
          # Core and WooCommerce in Russian / Romanian for the language checks (stage 6); English stays the site default.
          e2e/node_modules/.bin/wp-env run cli wp language core install ru_RU ro_RO || true
          e2e/node_modules/.bin/wp-env run cli wp language plugin install woocommerce ru_RU ro_RO || true
          e2e/node_modules/.bin/wp-env run cli wp plugin list --fields=name,version,status
          e2e/node_modules/.bin/wp-env run cli wp core version
        env:
          WP_ENV_HOME: ${{ runner.temp }}/wp-env
      - name: Playwright
        run: mkdir -p results && npx playwright test
        continue-on-error: true
        id: pw
      - name: Report (Summary)
        if: always()
        run: node ../tools/e2e-report.js results/results.json "$GITHUB_STEP_SUMMARY" results/videos.tsv "Final run on the archive — E2E, HPOS ${HPOS}" tz
      - name: Stage video
        if: always() && matrix.hpos == 'on'
        run: |
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          SPEEDUP=3 bash ../tools/stage-video.sh results/videos.tsv "results/video-stage-${STAGE}.mp4" "Paynet for WooCommerce 1.0.0 — final report (x3 speed) — ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.hpos == 'on'
        with:
          name: video-stage-${{ env.STAGE }}
          path: e2e/results/video-stage-${{ env.STAGE }}.mp4
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && matrix.hpos == 'on'
        with:
          name: wporg-screenshots
          path: e2e/results/wporg
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || steps.pw.outcome == 'failure'
        with:
          name: e2e-details-hpos-${{ matrix.hpos }}
          path: |
            e2e/results/artifacts
            e2e/results/results.json
          retention-days: 30
      - name: WordPress debug log (on failure)
        if: failure() || steps.pw.outcome == 'failure'
        working-directory: .
        run: e2e/node_modules/.bin/wp-env run cli sh -c 'tail -n 80 wp-content/debug.log 2>/dev/null; ls wp-content/uploads/wc-logs 2>/dev/null; tail -n 60 wp-content/uploads/wc-logs/paynet-for-woocommerce-*.log 2>/dev/null' || true
        env:
          WP_ENV_HOME: ${{ runner.temp }}/wp-env
      - name: Playground link
        if: always() && matrix.hpos == 'on'
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BP=$(sed "s#\"ref\": \"main\"#\"ref\": \"${REF}\"#" ../playground/blueprint.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(encodeURIComponent(JSON.stringify(JSON.parse(s)))))')
          URL="https://playground.wordpress.net/#${BP}"
          {
            echo "## Playground"
            echo ""
            echo "Open in the browser (no installation): [WordPress Playground — branch ${REF}](${URL})"
            echo ""
            echo "_Test mode with the public test credentials and a demo product. Notifications never reach Playground; the status is updated when you return from the Paynet page._"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if scenarios failed
        if: steps.pw.outcome == 'failure'
        run: exit 1

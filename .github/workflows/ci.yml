name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit --testdox --log-junit junit.xml
      - name: Report
        if: always()
        run: |
          {
            echo "## Unit tests — PHP ${{ matrix.php }}"
            if [ -f junit.xml ]; then
              php -r '$x=simplexml_load_file("junit.xml"); $s=$x->testsuite; printf("Tests: **%d**, failures: **%d**, errors: **%d**\n\n", $s["tests"], $s["failures"], $s["errors"]);'
            else
              echo "No result file."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distributable copy
        run: |
          mkdir -p build/paynet-for-woocommerce
          rsync -a --exclude-from=.distignore ./ build/paynet-for-woocommerce/
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/paynet-for-woocommerce

  e2e:
    name: E2E (HPOS ${{ matrix.hpos }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        hpos: ['on', 'off']
    env:
      STAGE: '3'
      HPOS: ${{ matrix.hpos }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress + WooCommerce
        run: e2e/node_modules/.bin/wp-env start
        working-directory: .
        env:
          WP_ENV_HOME: ${{ runner.temp }}/wp-env
      - name: Prepare store (MDL, Moldova)
        working-directory: .
        run: |
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_currency MDL
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_default_country MD
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_coming_soon no
          e2e/node_modules/.bin/wp-env run cli wp option update woocommerce_onboarding_profile '{"skipped":true}' --format=json
          if [ "$HPOS" = "on" ]; then
            e2e/node_modules/.bin/wp-env run cli wp wc hpos enable
          else
            e2e/node_modules/.bin/wp-env run cli wp wc hpos disable
          fi
          e2e/node_modules/.bin/wp-env run cli wp wc hpos status || true
          e2e/node_modules/.bin/wp-env run cli wp plugin list --fields=name,version,status
        env:
          WP_ENV_HOME: ${{ runner.temp }}/wp-env
      - name: Playwright
        run: mkdir -p results && npx playwright test
        continue-on-error: true
        id: pw
      - name: Report (Summary)
        if: always()
        run: node ../tools/e2e-report.js results/results.json "$GITHUB_STEP_SUMMARY" results/videos.tsv "E2E scenarios — HPOS ${HPOS}" "stage${STAGE}.spec.js" || true
      - name: Stage video
        if: always() && matrix.hpos == 'on'
        run: |
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          bash ../tools/stage-video.sh results/videos.tsv "results/video-stage-${STAGE}.mp4" "Paynet for WooCommerce — stage ${STAGE} — ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.hpos == 'on'
        with:
          name: video-stage-${{ env.STAGE }}
          path: e2e/results/video-stage-${{ env.STAGE }}.mp4
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure() || steps.pw.outcome == 'failure'
        with:
          name: e2e-details-hpos-${{ matrix.hpos }}
          path: |
            e2e/results/artifacts
            e2e/results/results.json
          retention-days: 30
      - name: WordPress debug log (on failure)
        if: failure() || steps.pw.outcome == 'failure'
        working-directory: .
        run: e2e/node_modules/.bin/wp-env run cli sh -c 'tail -n 80 wp-content/debug.log 2>/dev/null; ls wp-content/uploads/wc-logs 2>/dev/null; tail -n 60 wp-content/uploads/wc-logs/paynet-for-woocommerce-*.log 2>/dev/null' || true
        env:
          WP_ENV_HOME: ${{ runner.temp }}/wp-env
      - name: Playground link
        if: always() && matrix.hpos == 'on'
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BP=$(sed "s#\"ref\": \"main\"#\"ref\": \"${REF}\"#" ../playground/blueprint.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(encodeURIComponent(JSON.stringify(JSON.parse(s)))))')
          URL="https://playground.wordpress.net/#${BP}"
          {
            echo "## Playground"
            echo ""
            echo "Open in the browser (no installation): [WordPress Playground — branch ${REF}](${URL})"
            echo ""
            echo "_Test mode with the public test credentials and a demo product. Notifications never reach Playground; the status is updated when you return from the Paynet page._"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if scenarios failed
        if: steps.pw.outcome == 'failure'
        run: exit 1

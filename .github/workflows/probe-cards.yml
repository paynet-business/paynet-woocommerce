name: API probes — saved cards, refunds, old plugin orders

# Pays test orders on the Paynet page with the public shared credentials (docs.paynet.md)
# and prints findings to the log (ТЗ В-11…В-13). No WordPress involved.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Probe file in e2e/probe (empty = latest round)'
        default: ''
  push:
    branches: ['stage-*']
    paths: ['e2e/probe/**', '.github/workflows/probe-cards.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c probe/probe.config.js ${{ inputs.file || 'legacy' }}
